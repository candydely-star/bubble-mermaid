      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Restore
        run: dotnet restore BubbleMermaid.csproj
      - name: Publish self-contained Windows x64
        run: dotnet publish BubbleMermaid.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o publish
      - uses: actions/upload-artifact@v4
        with:
          name: BubbleMermaid-PC-v0-2-Windows-x64
          path: publish/**
          if-no-files-found: error
          retention-days: 30
